<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {wirePrint} from './print3d.js';
import {sound, confetti, centerOf as center, showCombo, popText, createHeartBonus, catchHeart} from './kit.js';

const P = PLAN, {H, W, D, aspect: A, palette: PAL} = P;
const HARD = new URLSearchParams(location.search).get('hard') === '1';
const JNAME = {black: 'ブラック', red: 'レッド', pink: 'ピンク', skin: 'ベージュ', white: 'ホワイト', yellow: 'イエロー', brown: 'ブラウン', gray: 'グレー', purple: 'パープル', orange: 'オレンジ', green: 'グリーン', blue: 'ブルー', navy: 'ネイビー', lightblue: 'ライトブルー'};
const col = c => PAL[c] ? c : 'black';
const rgb = c => PAL[col(c)];
const css = c => `rgb(${rgb(c).join(',')})`;
const dims = b => { const xs = b.cells.map(c => c[0]), zs = b.cells.map(c => c[2]); const w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...zs) - Math.min(...zs) + 1; return [Math.min(w, h), Math.max(w, h)]; };

function outline(cells, d = 0) {

  let p = start; do { pts.push(p); p = next.get(p.join()); } while (p.join() !== start.join());

document.title = `${CH.name}ミニナノ風 ゲーム${HARD ? '（むずかしい）' : ''}`;
document.getElementById('h1').textContent = document.title;
if (HARD) document.getElementById('rule').textContent += '【むずかしい】同じ段では、ポッチの少ないパーツから置いてね（同じ数ならどれからでもOK）。';

const $ = id => document.getElementById(id), $id = $;
// ---- 状態 ----
const placed = new Set();
let layer = 0, hearts = 3, hints = 3, sel = null, guideOn = true, blinkOn = false, t0 = 0, tEnd = 0, over = false, hintUntil = 0, missAt = null;
const layerBricks = y => P.bricks.filter(b => b.y === y);
const left = y => layerBricks(y).filter(b => !placed.has(b));
// むずかしいモード（?hard=1）：同じ段の中は、ポッチの少ないパーツから置く（同じ数ならどれからでも）。トレーの並びはシャッフル
const studs = b => b.cells.length;   // 丸1×1は1、L字は3、T字は4
let trayOrder = new Map();
const bestKey = () => `mininano-best-${CH.key}-${!guideOn ? 'n' : blinkOn ? 'g' : 'p'}${HARD ? '-h' : ''}`;
const guideName = () => (!guideOn ? 'ガイドなし' : blinkOn ? 'ガイド点滅' : 'ガイドあり') + (HARD ? '・むずかしい' : '');

// ---- 上から見た図 ----
const cv = document.getElementById('plan2d'), ctx = cv.getContext('2d');
const CELL = 44, PAD = 8;
const cells0 = P.bricks.flatMap(b => b.cells);   // 図は体のある範囲だけにして、マスを大きく見せる
const X0 = Math.min(...cells0.map(c => c[0])), X1 = Math.max(...cells0.map(c => c[0])), Z0 = Math.min(...cells0.map(c => c[2])), Z1 = Math.max(...cells0.map(c => c[2]));
const GW = X1 - X0 + 1, GD = Z1 - Z0 + 1;
cv.width = GW * CELL + PAD * 2; cv.height = GD * CELL + PAD * 2;
const xy = (x, z) => [PAD + (x - X0) * CELL, PAD + (Z1 - z) * CELL];
function rect(b) {
  const xs = b.cells.map(c => c[0]), zs = b.cells.map(c => c[2]);
  const [X0, Y0] = xy(Math.min(...xs), Math.max(...zs)), [X1, Y1] = xy(Math.max(...xs), Math.min(...zs));
  return [X0 + 2, Y0 + 2, X1 + CELL - 4 - X0, Y1 + CELL - 4 - Y0];
}
function brickPath(b) {
  const [x, y, w, h] = rect(b); ctx.beginPath();
  if (b.shape === 'round') ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 7);
  else if (bent(b.shape)) { outline(b.cells.map(([x, , z]) => [x, z]), 2 / CELL).forEach(([x, z], i) => ctx[i ? 'lineTo' : 'moveTo'](PAD + (x - X0) * CELL, PAD + (Z1 + 1 - z) * CELL)); ctx.closePath(); }

}
function draw2d(t) {

  ctx.strokeStyle = '#f0ebed'; ctx.lineWidth = 1;
  for (let k = 0; k <= GW; k++) { ctx.beginPath(); ctx.moveTo(PAD + k * CELL, PAD); ctx.lineTo(PAD + k * CELL, PAD + GD * CELL); ctx.stroke(); }
  for (let k = 0; k <= GD; k++) { ctx.beginPath(); ctx.moveTo(PAD, PAD + k * CELL); ctx.lineTo(PAD + GW * CELL, PAD + k * CELL); ctx.stroke(); }
  ctx.strokeStyle = '#c8c8c8'; ctx.lineWidth = 1;
  for (const b of layerBricks(layer - 1)) for (const [x, , z] of b.cells) { const [X, Y] = xy(x, z); ctx.strokeRect(X + 6, Y + 6, CELL - 12, CELL - 12); }
  const showAll = t < hintUntil;
  for (const b of layerBricks(layer)) {
    if (placed.has(b)) { brickPath(b); ctx.fillStyle = css(b.col); ctx.fill(); ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.5; ctx.stroke(); continue; }
    const match = sel && key(b) === sel && (blinkOn || showAll);   // 点滅は「ガイド点滅」と💡のときだけ
    if (showAll || guideOn) {   // ガイド：置く場所を色の点線で見せる。選んだパーツが合う場所は点滅
      brickPath(b); ctx.globalAlpha = showAll ? .8 : match ? .25 + .35 * Math.sin(t / 200) ** 2 : .18; ctx.fillStyle = css(b.col); ctx.fill(); ctx.globalAlpha = 1;
      ctx.setLineDash([6, 5]); ctx.strokeStyle = match ? '#e65f91' : '#9a8f94'; ctx.lineWidth = match ? 4 : 2; ctx.stroke(); ctx.setLineDash([]);

}

// ---- パーツ置き場（トレー）----
function pieceIcon(k, c) {
  const cs = k === 'L' ? [[0, 0], [0, 1], [1, 1]] : k === 'T' ? [[0, 0], [1, 0], [2, 0], [1, 1]] : null;   // L字・T字のマス（左上から）
  const el = document.createElement('canvas'), [a, b] = cs ? [2, k === 'L' ? 2 : 3] : k === 'round' || k === 'slope' ? (k === 'slope' ? [1, 2] : [1, 1]) : k.split('x').map(Number);
  const S = 14; el.width = b * S + 6; el.height = a * S + 6; const g = el.getContext('2d');
  g.fillStyle = css(c); g.strokeStyle = '#141414'; g.lineWidth = 2; g.beginPath();
  if (k === 'round') g.ellipse(el.width / 2, el.height / 2, S / 2, S / 2, 0, 0, 7);
  else if (cs) { outline(cs).forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](3 + x * S, 3 + y * S)); g.closePath(); }
  else g.roundRect(3, 3, b * S, a * S, 3);
  g.fill(); g.stroke();
  g.strokeStyle = rgb(c).reduce((s, v) => s + v, 0) > 300 ? '#0006' : '#fff9'; g.lineWidth = 1.2;
  for (const [i, j] of cs || Array.from({length: a * b}, (_, n) => [n % b, Math.floor(n / b)])) { g.beginPath(); g.arc(3 + (i + .5) * S, 3 + (j + .5) * S, S * .22, 0, 7); g.stroke(); }

}
function drawTray() {
  const m = new Map();
  for (const b of left(layer)) m.set(key(b), (m.get(key(b)) || 0) + 1);
  if (sel && !m.has(sel)) sel = null;
  if (!sel && m.size === 1) sel = [...m.keys()][0];
  const tray = document.getElementById('tray'); tray.innerHTML = '';
  const ent = [...m].sort();
  if (HARD) { for (const [k] of ent) if (!trayOrder.has(k)) trayOrder.set(k, Math.random()); ent.sort((a, b) => trayOrder.get(a[0]) - trayOrder.get(b[0])); }
  for (const [k, n] of ent) {
    const [c, kd] = k.split('|'), btn = document.createElement('button');
    btn.className = k === sel ? 'sel' : ''; btn.append(pieceIcon(kd, c));
    btn.insertAdjacentHTML('beforeend', `<span>${JNAME[c]} ${kindName(kd)}</span><span>×${n}</span>`);
    btn.onclick = () => { sel = k; drawTray(); };

// ---- 3D ----
const box = document.getElementById('view3d');
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f1ec);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 500);
const ren = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true}); ren.setPixelRatio(devicePixelRatio); box.append(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.5));
const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(20, 40, 30); scene.add(dl);
const lineMat = new THREE.LineBasicMaterial({color: 0x111111});
const stud = new THREE.CylinderGeometry(0.3, 0.3, 0.22, 14);
const ghostMat = new THREE.MeshBasicMaterial({color: 0x9a8f94, transparent: true, opacity: .12, depthWrite: false});
const obj = new Map();
function bentGeo(b, x0, x1, z0, z1, g) {   // L字・T字は外周を押し出して作る
  const sh = new THREE.Shape(outline(b.cells.map(([x, , z]) => [x, z]), g / 2).map(([x, z]) => new THREE.Vector2(x - .5 - (x0 + x1) / 2, z - .5 - (z0 + z1) / 2)));
  const geo = new THREE.ExtrudeGeometry(sh, {depth: A - g, bevelEnabled: false});
  geo.translate(0, 0, -(A - g) / 2); geo.rotateX(-Math.PI / 2); return geo;
}
for (const b of P.bricks) {
  const mat = new THREE.MeshLambertMaterial({color: new THREE.Color(...rgb(b.col).map(v => v / 255))});
  const xs = b.cells.map(c => c[0]), zs = b.cells.map(c => c[2]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs), g = 0.07;
  const geo = b.shape === 'round' ? new THREE.CylinderGeometry(0.46, 0.46, A - g, 20) : bent(b.shape) ? bentGeo(b, x0, x1, z0, z1, g) : new THREE.BoxGeometry(x1 - x0 + 1 - g, A - g, z1 - z0 + 1 - g);
  const grp = new THREE.Group(); grp.position.set((x0 + x1) / 2 - W / 2, b.y * A, -((z0 + z1) / 2 - D / 2));
  grp.add(new THREE.Mesh(geo, mat), new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat));
  for (const [x, , z] of b.cells) { const s = new THREE.Mesh(stud, mat); s.position.set(x - W / 2 - grp.position.x, A / 2 + 0.08, -(z - D / 2) - grp.position.z); grp.add(s); }
  const ghost = new THREE.Mesh(geo, ghostMat); ghost.position.copy(grp.position);
  grp.visible = false; scene.add(grp, ghost); obj.set(b, {grp, ghost, y0: grp.position.y, drop: 0});
}
const cells = P.bricks.flatMap(b => b.cells), mx = cells.reduce((s, c) => s + c[0], 0) / cells.length - W / 2, mz = -(cells.reduce((s, c) => s + c[2], 0) / cells.length - D / 2);
const ctl = new OrbitControls(cam, ren.domElement); ctl.enableDamping = true; ctl.enablePan = false;
ctl.target.set(mx, 2, mz); cam.position.set(mx + 9, 14, mz + 20);
let spin = false;
function resize() { const w = box.clientWidth, h = box.clientHeight; if (w && h) { ren.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); } }
new ResizeObserver(resize).observe(box); resize();
function refresh3d() { for (const [b, o] of obj) { o.grp.visible = placed.has(b); o.ghost.visible = !placed.has(b) && guideOn && b.y === layer; } }

// ---- 効果音・紙吹雪（naoblock-kit） ----
const syncSound = () => $id('soundBtn').textContent = sound.isMuted() ? '🔇' : '🔊';
syncSound();
$id('soundBtn').onclick = () => { sound.setMuted(!sound.isMuted()); syncSound(); sound.place(); };

// ---- コンボ ----
let combo = 0;

// ---- 飛んでくる ♥ ----
// 前半に 1 回・後半に 1 回、ランダムな数だけはめたところで ♥ が画面を横切る。時間内にタップすると ♥ が 1 つ戻る
// ♥ がいっぱいのときは何も起きない（取った数だけ数えておく。将来の得点用）
let heartBonus = 0;
const bonusHearts = createHeartBonus({total: P.bricks.length, area: box, onCatch: () => {
  if (over) return false;
  const r = catchHeart(hearts, 3);
  if (r.lives !== hearts) { hearts = r.lives; updateStatus(); }
  heartBonus += r.bonus;
  say(r.text); popText($id('combo'), r.text);
}});
function maybeHeart() { if (!over) bonusHearts.check(placed.size); }
function say(s) { $('msg').textContent = s; clearTimeout(say.t); say.t = setTimeout(() => $('msg').textContent = '', 1400); }
function updateStatus() {
  $('layerNo').textContent = `${layer + 1}段目`;
  $('layerSub').textContent = `のこり${left(layer).length}個 / 全${H}段`;
  $('hearts').textContent = '♥'.repeat(hearts) + '♡'.repeat(3 - hearts);
  $('hintBtn').textContent = `💡 ${hints}`; $('hintBtn').disabled = hints === 0;
}
function startLayer(y) { layer = y; sel = null; trayOrder = new Map(); drawTray(); updateStatus(); refresh3d(); if (y) { const el = $('layerNo'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } }
function tap(e) {
  if (over) return;
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * cv.width / r.width, py = (e.clientY - r.top) * cv.height / r.height;
  const x = X0 + Math.floor((px - PAD) / CELL), z = Z1 - Math.floor((py - PAD) / CELL);
  if (x < X0 || x > X1 || z < Z0 || z > Z1) return;
  if (!sel) { say('先にパーツを選んでね'); return; }
  if (!t0) t0 = performance.now();
  const b = left(layer).find(b => b.cells.some(c => c[0] === x && c[2] === z));
  const early = HARD && b && key(b) === sel && studs(b) > Math.min(...left(layer).map(studs));
  if (b && key(b) === sel && !early) {
    placed.add(b); const o = obj.get(b); o.drop = 1; refresh3d();
    combo++; sound.place(combo); showCombo($id('combo'), combo); navigator.vibrate?.(15);
    if (!left(layer).length) {
      if (layer === H - 1) { updateStatus(); $('tray').innerHTML = ''; bonusHearts.stop(); return clear(); }
      say(`${layer + 1}段目クリア！`); setTimeout(() => sound.layerDone(), 120); confetti(...center(cv), 36, .8); setTimeout(() => startLayer(layer + 1), 350);
    }
    drawTray(); updateStatus(); maybeHeart();
  } else {
    hearts--; combo = 0; sound.miss(); missAt = {x, z, t: performance.now()}; navigator.vibrate?.([60, 40, 60]);
    cv.classList.remove('shake'); void cv.offsetWidth; cv.classList.add('shake');
    say(early ? 'ポッチの少ないパーツから！' : b ? 'ちがうパーツです' : 'そこじゃないよ'); updateStatus();
    if (!hearts) gameOver();
  }
}
cv.addEventListener('pointerdown', tap);
function setGuide() { $('guideBtn').textContent = guideName(); $('guideBtn').classList.toggle('on', guideOn); refresh3d(); }
$('guideBtn').onclick = () => {   // あり → 点滅 → なし → あり
  if (t0) return say('組み始めたら切りかえできません');
  if (guideOn && !blinkOn) blinkOn = true; else if (guideOn) { guideOn = false; blinkOn = false; } else guideOn = true;
  setGuide(); say(guideOn ? blinkOn ? '合う場所が光ります' : '形と色はヒントだけ' : '図だけで勝負！');
};
setGuide();
$('hintBtn').onclick = () => { if (!hints || over) return; hints--; hintUntil = performance.now() + 1500; updateStatus(); };
const fmt = ms => (ms / 1000).toFixed(1);
function overlay(html) { $('overCard').innerHTML = html; $('over').style.display = 'flex'; }
function gameOver() {
  over = true; bonusHearts.stop();
  overlay(`<h2>ざんねん…</h2><p>${layer + 1}段目で♥がなくなりました</p><button onclick="location.reload()">もう一度</button><a class="sub" href="./?plan=${CH.key}">組立ガイドで確かめる</a>`);
}
function clear() {
  over = true; tEnd = performance.now(); const ms = tEnd - t0;
  const prev = +localStorage.getItem(bestKey()) || 0, best = !prev || ms < prev;
  if (best) localStorage.setItem(bestKey(), Math.round(ms));
  for (const o of obj.values()) o.ghost.visible = false;
  spin = true; ctl.target.set(mx, H * A / 2, mz);
  sound.clear(); const [cx, cy] = center(box); confetti(cx, cy, 90, 1.3); setTimeout(() => { confetti(innerWidth * .2, innerHeight * .4, 50, 1.1); confetti(innerWidth * .8, innerHeight * .4, 50, 1.1); }, 400);
  setTimeout(() => {
    const img = shareImage(ms);
    overlay(`<h2>完成！🎉</h2><img src="${img}" alt=""><p><b style="font-size:22px">${fmt(ms)}秒</b>　${'♥'.repeat(hearts)}${'♡'.repeat(3 - hearts)}</p>
      <p style="font-size:13px;color:#7a6e73">${best ? 'じこベスト更新！' : `じこベスト ${fmt(prev)}秒`}（${guideName()}）</p>
      <button id="shareBtn">シェアする</button><div class="row"><button class="sub" id="savePdf">組立図 PDF</button><button class="sub" id="printGuide">組立図を印刷</button></div><p id="printStatus" style="font-size:13px;color:#7a6e73" hidden></p><button class="sub" onclick="location.reload()">もう一度</button><a class="sub" href="./">キャラを選ぶ</a>`);
    $('shareBtn').onclick = () => share(img, ms);
    wirePrint({P, CH, pdfBtn: $('savePdf'), printBtn: $('printGuide'), status: $('printStatus')});
  }, 1200);
}
function shareImage(ms) {   // 3Dの絵＋タイムを1枚に
  const c = document.createElement('canvas'); c.width = 600; c.height = 700; const g = c.getContext('2d');
  g.fillStyle = '#f4f1ec'; g.fillRect(0, 0, 600, 700);
  const s = ren.domElement, k = Math.min(560 / s.width, 520 / s.height);
  g.drawImage(s, (600 - s.width * k) / 2, 70, s.width * k, s.height * k);
  g.fillStyle = '#3c3237'; g.textAlign = 'center'; g.font = 'bold 34px sans-serif'; g.fillText(`${CH.name}ミニナノ風 完成！`, 300, 50);
  g.fillStyle = '#e65f91'; g.font = 'bold 40px sans-serif'; g.fillText(`${fmt(ms)}秒  ${'♥'.repeat(hearts)}`, 300, 640);
  g.fillStyle = '#7a6e73'; g.font = '22px sans-serif'; g.fillText(`全${P.bricks.length}個・${guideName()}　#naoblock`, 300, 680);
  return c.toDataURL('image/png');
}
async function share(img, ms) {
  const text = `${CH.name}ミニナノ風を${fmt(ms)}秒で組み立てた！ #naoblock`;
  try {
    const file = new File([await (await fetch(img)).blob()], 'mininano.png', {type: 'image/png'});
    if (navigator.canShare?.({files: [file]})) return await navigator.share({files: [file], text});
    if (navigator.share) return await navigator.share({text, url: location.href});
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = img; a.download = 'mininano.png'; a.click();
}

// ---- 毎フレーム ----
(function loop(t) {
  t ||= 0;
  if (t0 && !over) $('timer').textContent = fmt(performance.now() - t0);
  const ty = spin ? H * A / 2 : Math.min(H * A * .55, layer * A + 1);
  ctl.target.y += (ty - ctl.target.y) * .06;
  const want = spin ? 30 : Math.min(28, 16 + layer * A * .9), off = cam.position.clone().sub(ctl.target), len = off.length();
  off.setLength(len + (want - len) * .06); cam.position.copy(ctl.target).add(off);
  if (spin) { const a = .006, x = cam.position.x - mx, z = cam.position.z - mz; cam.position.x = mx + x * Math.cos(a) - z * Math.sin(a); cam.position.z = mz + x * Math.sin(a) + z * Math.cos(a); }
  for (const o of obj.values()) {
    if (o.drop > 0) { o.drop = Math.max(0, o.drop - .08); o.grp.position.y = o.y0 + o.drop * o.drop * 3; if (!o.drop) o.bounce = 1; }   // 上から落ちてくる
    else if (o.bounce > 0) { o.bounce = Math.max(0, o.bounce - .07); const k = Math.sin(o.bounce * Math.PI * 2) * o.bounce * .18; o.grp.scale.set(1 + k * .6, 1 - k, 1 + k * .6); }   // 着地でぽよんと弾む
  }
  draw2d(t);
  ctl.update(); ren.render(scene, cam); requestAnimationFrame(loop);
})();
startLayer(0);
window.__game = {placed, left: () => left(layer), key, get layer() { return layer; }, tapCell: (x, z) => { const r = cv.getBoundingClientRect(); const [X, Y] = xy(x, z); tap({clientX: r.left + (X + CELL / 2) * r.width / cv.width, clientY: r.top + (Y + CELL / 2) * r.height / cv.height}); }, select: k => { sel = k; drawTray(); }};
</script>
</body></html>
